<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="Телефон со звонком мошенника и щит защиты">
  <!-- фон -->
  <circle cx="250" cy="210" r="185" fill="#fff7d6"/>
  <circle cx="250" cy="210" r="185" fill="none" stroke="#ffd21f" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round"/>
  <circle cx="70" cy="80" r="10" fill="#1f5fa8" opacity=".25"/>
  <circle cx="420" cy="330" r="14" fill="#0e6b3c" opacity=".25"/>
  <circle cx="430" cy="90" r="7" fill="#ffd21f"/>

  <!-- телефон -->
  <rect x="150" y="70" width="180" height="300" rx="30" fill="#143c6b"/>
  <rect x="162" y="86" width="156" height="268" rx="20" fill="#ffffff"/>
  <rect x="216" y="76" width="48" height="7" rx="3.5" fill="#0d2b4d"/>
  <!-- экран звонка -->
  <rect x="162" y="86" width="156" height="70" rx="20" fill="#1f5fa8"/>
  <circle cx="205" cy="121" r="17" fill="#ffd21f"/>
  <path d="M198 121a7 7 0 0 1 14 0" fill="none" stroke="#143c6b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="205" cy="115" r="5" fill="#143c6b"/>
  <rect x="232" y="108" width="72" height="9" rx="4.5" fill="#ffffff"/>
  <rect x="232" y="124" width="52" height="7" rx="3.5" fill="#bcd4ef"/>
  <!-- предупреждение -->
  <path d="M240 196l26 46h-52z" fill="#ffd21f" stroke="#143c6b" stroke-width="4" stroke-linejoin="round"/>
  <rect x="237" y="212" width="6" height="16" rx="3" fill="#143c6b"/>
  <circle cx="240" cy="234" r="3.5" fill="#143c6b"/>
  <rect x="186" y="258" width="108" height="10" rx="5" fill="#d5e0ee"/>
  <rect x="200" y="276" width="80" height="10" rx="5" fill="#d5e0ee"/>
  <!-- кнопки -->
  <circle cx="205" cy="322" r="19" fill="#0e6b3c"/>
  <path d="M198 322h14m-5-6l6 6-6 6" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="275" cy="322" r="19" fill="#ffd21f"/>
  <path d="M282 322h-14m5 6l-6-6 6-6" stroke="#143c6b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- щит -->
  <g>
    <path d="M355 150l62 22v46c0 42-27 73-62 86-35-13-62-44-62-86v-46l62-22z" fill="#1f5fa8" stroke="#143c6b" stroke-width="5"/>
    <path d="M327 218l20 20 38-40" fill="none" stroke="#ffd21f" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- монеты -->
  <g>
    <ellipse cx="105" cy="330" rx="26" ry="10" fill="#f0b400"/>
    <rect x="79" y="290" width="52" height="40" rx="8" fill="#ffd21f"/>
    <ellipse cx="105" cy="290" rx="26" ry="10" fill="#ffe066"/>
    <text x="105" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#143c6b">₽</text>
  </g>
  <g>
    <ellipse cx="415" cy="255" rx="20" ry="8" fill="#f0b400"/>
    <rect x="395" y="224" width="40" height="31" rx="7" fill="#ffd21f"/>
    <ellipse cx="415" cy="224" rx="20" ry="8" fill="#ffe066"/>
    <text x="415" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#143c6b">₽</text>
  </g>
</svg>
