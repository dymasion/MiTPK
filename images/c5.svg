  <circle cx="420" cy="60" r="40" fill="#e3f3ea"/>

  <!-- часы -->
  <g>
    <circle cx="150" cy="140" r="82" fill="#ffffff" stroke="#143c6b" stroke-width="10"/>
    <circle cx="150" cy="140" r="64" fill="#f2f6fb"/>
    <path d="M150 140V96" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <path d="M150 140l34 22" stroke="#143c6b" stroke-width="8" stroke-linecap="round"/>
